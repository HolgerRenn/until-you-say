<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171326">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; connect-src 'none'">
    <title>Until You Say</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="UNTIL YOU SAY">
    <meta property="og:image" content="https://holgerrenn.github.io/until-you-say/preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css?v=8">
    <script src="./app.js?v=6" defer></script>
  </head>
  <body>
    <main class="shell">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
      <article class="card" id="card">
        <header class="masthead">
          <span class="mark" aria-hidden="true">✦</span>
          <span class="brand">UNTIL YOU SAY</span>
          <span class="mark" aria-hidden="true">✦</span>
        </header>

        <section id="timer-view" hidden>
          <h1>Du bestimmst, wann ich darf. 😇</h1>
          <p class="phase-label" id="phase-label" hidden></p>
          <div class="ornament" aria-hidden="true"><span></span><i>✧</i><span></span></div>

          <div class="clock" role="timer" aria-label="Zeit seit dem Start">
            <div class="clock-unit"><strong id="days">0</strong><span>Tage</span></div>
            <b class="clock-separator" aria-hidden="true">:</b>
            <div class="clock-unit"><strong id="hours">00</strong><span>Stunden</span></div>
            <b class="clock-separator" aria-hidden="true">:</b>
            <div class="clock-unit"><strong id="minutes">00</strong><span>Minuten</span></div>
            <b class="clock-separator" aria-hidden="true">:</b>
            <div class="clock-unit"><strong id="seconds">00</strong><span>Sekunden</span></div>
          </div>

          <p class="since"><span id="start-label">Seit</span> <time id="start-time"></time></p>
          <p class="since" id="end-line" hidden>Bis <time id="end-time"></time></p>
          <p class="duration" id="duration-line" hidden>Dauer: <span id="duration"></span></p>
          <p class="closing">DU LEIDEST JA NICHT 😉</p>
          <section class="history" id="history" hidden>
            <h2>Abgeschlossene Enthaltsamkeit</h2>
            <div id="history-list"></div>
          </section>
        </section>
      </article>
    </main>
  </body>
</html>
