<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171326">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; connect-src https://api.emailjs.com">
  <title>Until You Say</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="UNTIL YOU SAY">
  <meta property="og:image" content="https://holgerrenn.github.io/until-you-say/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=34">
  <script src="./app.js?v=29" defer></script>
  <script src="./visit-notification.js?v=2" defer></script>
</head>
<body>
  <main class="shell">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <article class="card">
      <header class="masthead"><span class="mark" aria-hidden="true">✦</span><span class="brand">UNTIL YOU SAY</span><span class="mark" aria-hidden="true">✦</span></header>

      <section id="timer-view" hidden>
        <div id="running-view" hidden>
          <p class="phase-label" id="phase-label"></p>
          <div class="ornament" aria-hidden="true"><span></span><i>✧</i><span></span></div>
          <div class="day-counter" role="timer" aria-label="Vollständig vergangene Tage ohne Orgasmus">
            <strong id="days">0</strong>
            <p class="day-caption">Tage ohne Orgasmus</p>
          </div>
          <p class="since">Seit <time id="start-time"></time></p>
          <h1>Wann ich wieder darf? 🤷🏻‍♂️<span>Das entscheidest ganz alleine du. 😈</span></h1>
        </div>

        <div id="ended-view" hidden>
          <p class="phase-label ended-label">KONTROLLE BEENDET</p>
          <div class="ornament" aria-hidden="true"><span></span><i>✧</i><span></span></div>
          <section class="ended-summary">
            <h1>✧ UNTER DEINER KONTROLLE ✧</h1>
            <p class="ended-duration" id="ended-duration"></p>
            <p class="ended-range">
              <time id="ended-start"></time>
              <span>bis</span>
              <time id="ended-end"></time>
            </p>
          </section>
        </div>

        <section class="overall" id="overall" hidden>
          <h2>✧ UNTER DEINER KONTROLLE ✧</h2>
          <p class="overall-duration" id="overall-duration"></p>
          <p class="overall-since">Seit <time id="overall-start"></time></p>
        </section>

        <p class="closing">DU LEIDEST JA NICHT 😉</p>

        <section class="history" id="history" hidden>
          <button class="history-toggle" id="history-toggle" type="button" aria-expanded="false" aria-controls="history-content">
            <span class="history-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                <path d="M3 4v5h5"></path>
                <path d="M12 7v5l3 2"></path>
              </svg>
            </span>
            <span class="history-toggle-text">
              <strong>Historie</strong>
              <span id="history-count"></span>
              <span id="history-action">Verlauf anzeigen</span>
            </span>
            <span id="history-chevron" aria-hidden="true">⌄</span>
          </button>

          <div id="history-content" hidden>
            <div class="history-tabs" role="tablist" aria-label="Historienansicht">
              <button type="button" id="view-controls" role="tab" aria-selected="true">Kontrollen</button>
              <button type="button" id="view-abstinences" role="tab" aria-selected="false">Alle Enthaltsamkeiten</button>
            </div>

            <div id="controls-history">
              <div id="controls-list"></div>
            </div>

            <div id="abstinences-history" hidden>
              <div class="history-sort" id="history-sort" role="group" aria-label="Enthaltsamkeiten sortieren">
                <button type="button" id="sort-newest" aria-pressed="true">Neueste</button>
                <button type="button" id="sort-longest" aria-pressed="false">Längste</button>
              </div>
              <div id="history-list"></div>
            </div>
          </div>
        </section>
      </section>
    </article>
  </main>
</body>
</html>
